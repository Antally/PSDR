{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <h1 class="fw-bold mb-4">Parking Sites</h1>
  <div class="row g-3">
    {% for s in sites %}
      <div class="col-md-4">
        <a href="{% url 'parking:site_detail' s.pk %}" class="text-decoration-none">
          <div class="card p-3 h-100">
            <h5>{{ s.name }}</h5>
            <p class="text-muted small mb-0">{{ s.address }}</p>
          </div>
        </a>
      </div>
    {% empty %}
      <p>No parking sites yet. Run <code>python manage.py seed_psdr</code>.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
