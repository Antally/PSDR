{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <h2 class="fw-bold mb-4">Register as {{ role }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-2"><input name="first_name" class="form-control" placeholder="First name"></div>
    <div class="mb-2"><input name="last_name"  class="form-control" placeholder="Last name"></div>
    <div class="mb-2"><input name="username"   class="form-control" placeholder="Username" required></div>
    <div class="mb-2"><input name="email"      type="email" class="form-control" placeholder="Email"></div>
    <div class="mb-2"><input name="password"   type="password" class="form-control" placeholder="Password" required></div>
    {% if role == 'driver' %}<div class="mb-2"><input name="plate" class="form-control" placeholder="Plate (optional)"></div>{% endif %}
    {% if role == 'parking_owner' %}<div class="mb-2"><input name="company" class="form-control" placeholder="Company name"></div>{% endif %}
    {% if role == 'event_hoster' %}<div class="mb-2"><input name="organization" class="form-control" placeholder="Organization"></div>{% endif %}
    <button class="btn btn-primary w-100 mt-3">Register</button>
  </form>
</div>
{% endblock %}
